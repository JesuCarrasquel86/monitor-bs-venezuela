<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>monitor-bs-vz</title>
    <meta name="description" content="Calculadora y monitor de tasas BCV, Euro y USDT para Venezuela.">
    <meta name="theme-color" content="#0d1723">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Monitor Bs">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css?v=2.1">
</head>

<body>

    <!-- Tooltip / Info Sheet -->
    <div id="tooltip-overlay" class="tooltip-overlay hidden" aria-hidden="true">
        <div id="tooltip-sheet" class="tooltip-sheet">
            <div class="tooltip-header">
                <div class="tooltip-icon-wrap">
                    <i data-lucide="info" class="w-4 h-4"></i>
                </div>
                <h3 id="tooltip-title" class="tooltip-title"></h3>
                <button id="tooltip-close" class="tooltip-close">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <p id="tooltip-body" class="tooltip-body"></p>
        </div>
    </div>

    <!-- Calculadora (overlay) -->
    <div id="calc-overlay" class="tooltip-overlay hidden" aria-hidden="true">
        <div id="calc-sheet" class="tooltip-sheet calc-sheet">
            <div class="tooltip-header">
                <div class="tooltip-icon-wrap">
                    <i data-lucide="calculator" class="w-4 h-4"></i>
                </div>
                <h3 class="tooltip-title">Calculadora</h3>
                <button id="calc-close" class="tooltip-close">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="calc-items hidden" id="calc-items"></div>

            <div class="calc-display">
                <div class="calc-expression" id="calc-expression">0</div>
                <div class="calc-result" id="calc-result">&nbsp;</div>
            </div>

            <div class="calc-keypad">
                <button class="calc-key calc-key-fn" data-key="C">C</button>
                <button class="calc-key calc-key-fn" data-key="back">
                    <i data-lucide="delete" class="w-4 h-4"></i>
                </button>
                <button class="calc-key calc-key-fn" data-key="%">%</button>
                <button class="calc-key calc-key-op" data-key="/">÷</button>

                <button class="calc-key" data-key="7">7</button>
                <button class="calc-key" data-key="8">8</button>
                <button class="calc-key" data-key="9">9</button>
                <button class="calc-key calc-key-op" data-key="*">×</button>

                <button class="calc-key" data-key="4">4</button>
                <button class="calc-key" data-key="5">5</button>
                <button class="calc-key" data-key="6">6</button>
                <button class="calc-key calc-key-op" data-key="-">−</button>

                <button class="calc-key" data-key="1">1</button>
                <button class="calc-key" data-key="2">2</button>
                <button class="calc-key" data-key="3">3</button>
                <button class="calc-key calc-key-op" data-key="+">+</button>

                <button class="calc-key calc-key-wide" data-key="0">0</button>
                <button class="calc-key" data-key=".">.</button>
                <button class="calc-key calc-key-eq" data-key="=">=</button>
            </div>

            <button id="btn-calc-use" class="btn-accent calc-use-btn">
                Usar este total como Cantidad
            </button>

            <div class="calc-history hidden" id="calc-history"></div>
        </div>
    </div>

    <!-- Banner PWA -->
    <div id="install-banner" class="install-banner hidden">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-accent flex items-center justify-center shrink-0">
                <i data-lucide="smartphone" class="w-4 h-4 text-white"></i>
            </div>
            <div>
                <p class="text-sm font-semibold text-primary">Instalar app</p>
                <p class="text-xs text-tertiary">Acceso rápido desde tu pantalla</p>
            </div>
        </div>
        <div class="flex gap-2 shrink-0">
            <button id="btn-install-dismiss" class="btn-ghost text-xs px-3 py-1.5">No</button>
            <button id="btn-install" class="btn-accent text-xs px-4 py-1.5 font-semibold">Instalar</button>
        </div>
    </div>

    <!-- Card principal -->
    <div class="app-card">

        <!-- Cabecera -->
        <div class="app-header">
            <div class="flex items-center gap-2">
                <div class="header-logo">
                    <i data-lucide="trending-up" class="w-4 h-4"></i>
                </div>
                <div>
                    <h1 class="text-[15px] font-semibold text-primary leading-none">Monitor Bs.</h1>
                    <p class="text-[11px] text-tertiary mt-0.5 leading-none" id="text-update">Actualizando...</p>
                </div>
                <div id="offline-badge" class="hidden offline-badge">
                    <i data-lucide="wifi-off" class="w-3 h-3"></i>
                    <span>Offline</span>
                </div>
            </div>
            <div class="flex items-center gap-1">
                <button id="btn-theme" class="icon-btn" title="Cambiar tema">
                    <i data-lucide="sun" class="w-4 h-4" id="icon-theme"></i>
                </button>
                <button id="btn-refresh" class="icon-btn" title="Actualizar">
                    <i data-lucide="refresh-cw" class="w-4 h-4" id="icon-refresh"></i>
                </button>
            </div>
        </div>

        <!-- Input Calculadora -->
        <div class="input-section">
            <!-- Label con botón ? + quick amounts en la misma fila -->
            <div class="section-label-row">
                <label class="section-label">Cantidad</label>
                <button class="help-btn" data-tip="cantidad">
                    <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
                </button>
                <!-- Botones rápidos de monto (inline) -->
                <div class="quick-amounts-inline">
                    <button class="quick-btn" data-amount="10">10</button>
                    <button class="quick-btn" data-amount="20">20</button>
                    <button class="quick-btn" data-amount="30">30</button>
                    <button class="quick-btn" data-amount="50">50</button>
                    <button class="quick-btn" data-amount="100">100</button>
                </div>
            </div>
            <div class="input-wrap">
                <button id="btn-currency-mode" class="input-prefix-btn" title="Cambiar modo">
                    <span id="currency-mode-label">USD / EUR</span>
                    <i data-lucide="arrow-left-right" class="w-3 h-3 ml-1 opacity-50"></i>
                </button>
                <input type="number" id="input-amount" value="1" min="0" step="any" placeholder="0" class="calc-input"
                    inputmode="decimal">
                <button id="btn-open-calc" class="input-calc-btn" title="Abrir calculadora">
                    <i data-lucide="calculator" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Resultado estrella -->
            <div class="usdt-hero">
                <div class="usdt-hero-content">
                    <!-- Fila superior: etiqueta + selector de nombre + help -->
                    <div class="usdt-top-row">
                        <span class="pulse-dot"></span>
                        <span class="usdt-label-text">Diferencia a tasa</span>
                        <button class="help-btn help-btn-yellow" data-tip="usdt">
                            <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>

                    <!-- Valor grande + compartir + copiar -->
                    <div class="usdt-value-row">
                        <p class="usdt-value" id="eq-usdt">--</p>
                        <button id="btn-share" class="copy-btn" title="Compartir">
                            <i data-lucide="share-2" class="w-4 h-4" id="icon-share"></i>
                        </button>
                        <button id="btn-copy-usdt" class="copy-btn" title="Copiar">
                            <i data-lucide="copy" class="w-4 h-4" id="icon-copy"></i>
                        </button>
                    </div>

                    <!-- Sub-explicación -->
                    <p class="usdt-sub">
                        Para cubrir <strong id="sub-amount">1 USD</strong> a tasa BCV vendiendo USDT en Binance
                    </p>

                    <!-- Acción rápida: copiar monto y abrir Binance P2P -->
                    <button id="btn-binance-p2p" class="binance-action-btn">
                        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                        Copiar monto y abrir Binance P2P
                    </button>
                </div>
            </div>
        </div>


        <!-- Grid de tasas -->
        <div class="rates-section">
            <!-- Cabecera de tasas -->
            <div class="rates-header">
                <div class="rates-title-row">
                    <p class="section-label">Tasas</p>
                    <span class="rate-date-badge" id="rate-date-badge"></span>
                </div>
                <!-- Selector de días: últimos 7 días -->
                <div class="days-bar" id="days-bar"></div>
            </div>
            <div class="rates-grid">

                <!-- BCV -->
                <div class="rate-card red">
                    <div class="rate-header">
                        <span class="rate-tag red">BCV</span>
                        <button class="help-btn" data-tip="bcv">
                            <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                    <p class="rate-value" id="total-bcv">--</p>
                    <p class="rate-base"><span id="base-bcv">--</span> Bs/$</p>
                </div>

                <!-- Binance -->
                <div class="rate-card yellow">
                    <div class="rate-header">
                        <span class="rate-tag yellow">Binance</span>
                        <button class="help-btn" data-tip="binance">
                            <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                    <p class="rate-value" id="total-binance">--</p>
                    <p class="rate-base"><span id="base-binance">--</span> Bs/$</p>
                </div>

                <!-- Euro -->
                <div class="rate-card blue">
                    <div class="rate-header">
                        <span class="rate-tag blue">Euro BCV</span>
                        <button class="help-btn" data-tip="euro">
                            <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                    <p class="rate-value" id="total-euro">--</p>
                    <p class="rate-base"><span id="base-euro">--</span> Bs/€</p>
                </div>

                <!-- Brecha -->
                <div class="rate-card gap-card" id="gap-card">
                    <div class="rate-header">
                        <span class="rate-tag gap">Brecha</span>
                        <div class="rate-header-actions">
                            <button id="btn-gap-alert" class="help-btn" title="Configurar alerta de brecha">
                                <i data-lucide="bell" class="w-3.5 h-3.5"></i>
                            </button>
                            <button class="help-btn" data-tip="brecha">
                                <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                    <div id="diff-pct" class="gap-pct">--</div>
                    <p class="gap-bs" id="diff-bs">--</p>
                </div>

            </div>

            <!-- Euro en USDT — oculto por ahora -->
            <div class="extra-row hidden">
                <span id="eq-usdt-euro"></span>
            </div>

            <!-- Error -->
            <div id="error-msg" class="hidden error-box">
                <i data-lucide="alert-circle" class="w-3.5 h-3.5 shrink-0 mt-0.5 text-amber-400"></i>
                <p id="error-text"></p>
            </div>
        </div>

        <!-- Footer -->
        <div class="app-footer">
            <button id="btn-main" class="btn-main">
                <i data-lucide="calculator" class="w-4 h-4" id="icon-main"></i>
                <span id="text-main">Actualizar Monitor</span>
            </button>
        </div>

    </div>

    <script src="app.js?v=2.1"></script>
</body>

</html>
